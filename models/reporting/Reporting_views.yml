version: 2

models:

  - name: rpt_total_sales_by_category
    description: Total sales, cost, and profit rolled up by product category/subcategory.
    columns:
      - name: category
      - name: subcategory
      - name: total_quantity_sold
      - name: total_sales_amount
      - name: total_cost_amount
      - name: total_profit_amount

  - name: rpt_sales_trend_by_region
    description: Monthly sales and profit trend, sliced by region.
    columns:
      - name: region
      - name: year
      - name: month
      - name: month_name
      - name: total_sales_amount
      - name: total_profit_amount
      - name: order_count

  - name: rpt_top_selling_products
    description: Products ranked by total sales amount.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_name
      - name: category
      - name: brand
      - name: total_quantity_sold
      - name: total_sales_amount
      - name: total_profit_amount
      - name: sales_rank
        tests:
          - not_null

  - name: rpt_customer_purchasing_behavior
    description: >
      Customer-grain purchasing behavior — order frequency, average order value,
      basket size, and recency. Orders are collapsed to order grain first to
      avoid inflating counts from fact_sales' line-item grain.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: total_orders
      - name: total_lifetime_sales
      - name: avg_order_value
      - name: avg_items_per_order
      - name: first_purchase_date
      - name: last_purchase_date
      - name: days_since_last_purchase

  - name: rpt_customer_lifetime_value
    description: >
      Historical/observed customer lifetime value (cumulative profit to date).
      Not a predictive CLV model.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: segment
      - name: total_orders
      - name: total_revenue
      - name: customer_lifetime_value
      - name: avg_order_value

  - name: rpt_repeat_purchase_rate
    description: >
      Customer-grain repeat purchase flag, sliceable by segment. Overall repeat
      purchase rate is computed downstream (avg of is_repeat_customer), not
      pre-aggregated here.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: segment
      - name: total_orders
      - name: is_repeat_customer
        tests:
          - not_null

  - name: rpt_customer_segmentation_analysis
    description: >
      Revenue, profit, and customer counts aggregated by customer segment,
      using the segment denormalized onto fact_sales.
    columns:
      - name: segment
      - name: customer_count
      - name: total_orders
      - name: total_revenue
      - name: total_profit
      - name: avg_revenue_per_customer
      - name: avg_profit_per_customer

  - name: rpt_sales_contribution_by_employee_role
    description: Total sales, profit, and per-employee averages rolled up by employee role.
    columns:
      - name: role
      - name: employee_count
      - name: total_orders
      - name: total_sales_amount
      - name: total_profit_amount
      - name: avg_sales_per_employee
 
  - name: rpt_top_performing_employees_by_region
    description: >
      Employees ranked by total sales within their region (partitioned rank).
      An employee selling across multiple regions gets one row per region.
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null
      - name: full_name
      - name: region
      - name: total_orders
      - name: total_sales_amount
      - name: total_profit_amount
      - name: region_sales_rank
        tests:
          - not_null
 
  - name: rpt_tenure_vs_performance_metrics
    description: >
      Employee-grain view combining tenure, performance_rating, and
      target_achievement_pct with sales outcomes, intended for correlation/
      scatter analysis in a BI tool.
    columns:
      - name: employee_id
        tests:
          - unique
          - not_null
      - name: full_name
      - name: role
      - name: tenure_years
      - name: performance_rating
      - name: target_achievement_pct
      - name: total_orders
      - name: total_sales_amount
      - name: total_profit_amount
 